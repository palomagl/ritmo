<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Ritmo</title>
    <meta name="description" content="Passos, corridas, alimentação com IA, água e corpo num app só." />
    <meta name="author" content="Paloma Lorenzon" />

    <!-- Tema escolhido no Perfil, aplicado antes de pintar para não piscar.
         Sem escolha, segue o celular (claro ou escuro). -->
    <script>
      try {
        var t = localStorage.getItem("pulso:tema");
        if (t === "claro" || t === "escuro") {
          document.documentElement.setAttribute("data-tema", t);
        }
      } catch (e) {}
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Telas de abertura do iOS (o iPhone ignora a splash do manifest). -->
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="/splash/375x667@2x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="/splash/375x812@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="/splash/414x896@2x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/splash/390x844@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="/splash/428x926@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/splash/393x852@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/splash/430x932@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)" href="/splash/402x874@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" href="/splash/440x956@3x.png" />

    <meta name="theme-color" content="#EEF3FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1020" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        var tc = localStorage.getItem("pulso:tema");
        if (tc === "claro" || tc === "escuro") {
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.removeAttribute("media");
            m.setAttribute("content", tc === "claro" ? "#EEF3FA" : "#0B1020");
          });
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ritmo" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
